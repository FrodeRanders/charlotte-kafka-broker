[workspace]
members = ["crates/*"]
# SDK sources remain a separate workspace with their own formatting and tests.
exclude = [
    ".charlotte/sdk/charlotte-app-sdk/crates/catten-rt",
    ".charlotte/sdk/charlotte-app-sdk/crates/catten-syscall",
    ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-app",
    ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-app-sitas",
    ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-kafka",
    ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-launch",
    ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-lifecycle",
    ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-protocol-grant",
    ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-protocol-kafka",
    ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-protocol-s3",
    ".charlotte/sdk/charlotte-app-sdk/crates/sitas-charlotte",
    ".charlotte/sdk/charlotte-app-sdk/crates/sitas-core",
    ".charlotte/sdk/charlotte-app-sdk/crates/sitas-unix",
]
default-members = [
    "crates/broker-core",
    "crates/broker-engine",
    "crates/broker-host",
    "crates/broker-runtime",
    "crates/broker-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
broker-core = { path = "crates/broker-core" }
broker-engine = { path = "crates/broker-engine" }
broker-runtime = { path = "crates/broker-runtime" }
broker-wire = { path = "crates/broker-wire" }
catten-rt = { path = ".charlotte/sdk/charlotte-app-sdk/crates/catten-rt" }
charlotte-app = { path = ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-app", features = ["socket"] }
charlotte-launch = { path = ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-launch" }
charlotte-kafka = { path = ".charlotte/sdk/charlotte-app-sdk/crates/charlotte-kafka" }
sitas-core = { path = ".charlotte/sdk/charlotte-app-sdk/crates/sitas-core", default-features = false }
sitas-charlotte = { path = ".charlotte/sdk/charlotte-app-sdk/crates/sitas-charlotte", default-features = false }
sitas-unix = { path = ".charlotte/sdk/charlotte-app-sdk/crates/sitas-unix" }
spin = "0.9"

# Match the CharlotteOS workspace code generation for EL0 service images.
[profile.release]
debug = "none"
debug-assertions = false
panic = "abort"
lto = true
opt-level = 3
