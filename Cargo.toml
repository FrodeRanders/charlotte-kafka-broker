[workspace]
members = ["crates/*"]
default-members = [
    "crates/broker-core",
    "crates/broker-engine",
    "crates/broker-host",
    "crates/broker-runtime",
    "crates/broker-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
broker-core = { path = "crates/broker-core" }
broker-engine = { path = "crates/broker-engine" }
broker-runtime = { path = "crates/broker-runtime" }
broker-wire = { path = "crates/broker-wire" }
catten-rt = { git = "https://github.com/FrodeRanders/charlotte-os", tag = "app-platform-833025bb" }
catten-services = { git = "https://github.com/FrodeRanders/charlotte-os", tag = "app-platform-833025bb" }
charlotte-kafka = { git = "https://github.com/FrodeRanders/charlotte-os", tag = "app-platform-833025bb" }
charlotte-launch = { git = "https://github.com/FrodeRanders/charlotte-os", tag = "app-platform-833025bb" }
sitas-charlotte = { git = "https://github.com/FrodeRanders/sitas", tag = "charlotte-x86-64-2c0f800", default-features = false }
sitas-core = { git = "https://github.com/FrodeRanders/sitas", tag = "charlotte-x86-64-2c0f800", default-features = false }
sitas-unix = { git = "https://github.com/FrodeRanders/sitas", tag = "charlotte-x86-64-2c0f800" }


# Match the CharlotteOS workspace code generation for EL0 service images.
[profile.release]
debug = "none"
debug-assertions = false
panic = "abort"
lto = true
opt-level = 3
