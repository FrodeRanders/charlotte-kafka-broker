[workspace]
members = ["crates/*"]
# SDK sources remain a separate workspace with their own formatting and tests.
exclude = [
    ".knytos/sdk/knytos-app-sdk/crates/knytos-rt",
    ".knytos/sdk/knytos-app-sdk/crates/knytos-syscall",
    ".knytos/sdk/knytos-app-sdk/crates/knytos-app",
    ".knytos/sdk/knytos-app-sdk/crates/knytos-app-sitas",
    ".knytos/sdk/knytos-app-sdk/crates/knytos-kafka",
    ".knytos/sdk/knytos-app-sdk/crates/knytos-launch",
    ".knytos/sdk/knytos-app-sdk/crates/knytos-lifecycle",
    ".knytos/sdk/knytos-app-sdk/crates/knytos-protocol-grant",
    ".knytos/sdk/knytos-app-sdk/crates/knytos-protocol-kafka",
    ".knytos/sdk/knytos-app-sdk/crates/knytos-protocol-s3",
    ".knytos/sdk/knytos-app-sdk/crates/sitas-knytos",
    ".knytos/sdk/knytos-app-sdk/crates/sitas-core",
    ".knytos/sdk/knytos-app-sdk/crates/sitas-unix",
]
default-members = [
    "crates/broker-core",
    "crates/broker-engine",
    "crates/broker-host",
    "crates/broker-runtime",
    "crates/broker-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
broker-core = { path = "crates/broker-core" }
broker-engine = { path = "crates/broker-engine" }
broker-runtime = { path = "crates/broker-runtime" }
broker-wire = { path = "crates/broker-wire" }
knytos-rt = { path = ".knytos/sdk/knytos-app-sdk/crates/knytos-rt" }
knytos-app = { path = ".knytos/sdk/knytos-app-sdk/crates/knytos-app", features = ["socket"] }
knytos-launch = { path = ".knytos/sdk/knytos-app-sdk/crates/knytos-launch" }
knytos-kafka = { path = ".knytos/sdk/knytos-app-sdk/crates/knytos-kafka" }
sitas-core = { path = ".knytos/sdk/knytos-app-sdk/crates/sitas-core", default-features = false }
sitas-knytos = { path = ".knytos/sdk/knytos-app-sdk/crates/sitas-knytos", default-features = false }
sitas-unix = { path = ".knytos/sdk/knytos-app-sdk/crates/sitas-unix" }
spin = "0.9"

# Match the Knytos workspace code generation for EL0 service images.
[profile.release]
debug = "none"
debug-assertions = false
panic = "abort"
lto = true
opt-level = 3
