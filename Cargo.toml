[workspace]
members = ["crates/*"]
default-members = [
    "crates/broker-core",
    "crates/broker-engine",
    "crates/broker-host",
    "crates/broker-runtime",
    "crates/broker-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
broker-core = { path = "crates/broker-core" }
broker-engine = { path = "crates/broker-engine" }
broker-runtime = { path = "crates/broker-runtime" }
broker-wire = { path = "crates/broker-wire" }
catten-rt = { git = "https://github.com/FrodeRanders/charlotte-os", rev = "9f3d5203e4604c3113afb07e25b28ef6cd0db48c" }
catten-services = { git = "https://github.com/FrodeRanders/charlotte-os", rev = "9f3d5203e4604c3113afb07e25b28ef6cd0db48c" }
charlotte-kafka = { git = "https://github.com/FrodeRanders/charlotte-os", rev = "9f3d5203e4604c3113afb07e25b28ef6cd0db48c" }
charlotte-launch = { git = "https://github.com/FrodeRanders/charlotte-os", rev = "9f3d5203e4604c3113afb07e25b28ef6cd0db48c" }
sitas-charlotte = { git = "https://github.com/FrodeRanders/sitas", rev = "d27f7e7b7a6e3657c9b39e53da02cf0cd8f91a78", default-features = false }
sitas-core = { git = "https://github.com/FrodeRanders/sitas", rev = "d27f7e7b7a6e3657c9b39e53da02cf0cd8f91a78", default-features = false }
sitas-unix = { git = "https://github.com/FrodeRanders/sitas", rev = "d27f7e7b7a6e3657c9b39e53da02cf0cd8f91a78" }


# Match the CharlotteOS workspace code generation for EL0 service images.
[profile.release]
debug = "none"
debug-assertions = false
panic = "abort"
lto = true
opt-level = 3
