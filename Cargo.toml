[workspace]
members = ["crates/*"]
default-members = [
    "crates/broker-core",
    "crates/broker-engine",
    "crates/broker-host",
    "crates/broker-runtime",
    "crates/broker-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
broker-core = { path = "crates/broker-core" }
broker-engine = { path = "crates/broker-engine" }
broker-runtime = { path = "crates/broker-runtime" }
broker-wire = { path = "crates/broker-wire" }
catten-rt = { git = "https://github.com/FrodeRanders/charlotte-os", rev = "981f9cea767cba3045bfd78264392068c81285f3" }
catten-services = { git = "https://github.com/FrodeRanders/charlotte-os", rev = "981f9cea767cba3045bfd78264392068c81285f3" }
charlotte-kafka = { git = "https://github.com/FrodeRanders/charlotte-os", rev = "981f9cea767cba3045bfd78264392068c81285f3" }
charlotte-launch = { git = "https://github.com/FrodeRanders/charlotte-os", rev = "981f9cea767cba3045bfd78264392068c81285f3" }
sitas-charlotte = { git = "https://github.com/FrodeRanders/sitas", rev = "6d63266eb52492c1958c45f3ed71c8c7a451489a", default-features = false }
sitas-core = { git = "https://github.com/FrodeRanders/sitas", rev = "6d63266eb52492c1958c45f3ed71c8c7a451489a", default-features = false }
sitas-unix = { git = "https://github.com/FrodeRanders/sitas", rev = "6d63266eb52492c1958c45f3ed71c8c7a451489a" }


# Match the CharlotteOS workspace code generation for EL0 service images.
[profile.release]
debug = "none"
debug-assertions = false
panic = "abort"
lto = true
opt-level = 3
